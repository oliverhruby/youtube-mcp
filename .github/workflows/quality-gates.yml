name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile server module
        run: python -m py_compile src/youtube_mcp/__init__.py

      - name: Install package from source
        run: python -m pip install --upgrade pip && python -m pip install .

  docker-mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MCP client dependency
        run: python -m pip install --upgrade pip && python -m pip install "mcp<2"

      - name: Build Docker image
        run: docker build -t youtube-mcp:ci .

      - name: MCP stdio handshake + tools list
        run: |
          python - <<'PY'
          import asyncio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(
                  command="docker",
                  args=["run", "--rm", "-i", "youtube-mcp:ci"],
              )
              async with stdio_client(params) as (read_stream, write_stream):
                  async with ClientSession(read_stream, write_stream) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      items = getattr(tools, "tools", []) or []
                      if len(items) < 3:
                          raise SystemExit(f"Expected >=3 tools, got {len(items)}")
                      print(f"MCP smoke OK, tools={len(items)}")

          asyncio.run(main())
          PY
